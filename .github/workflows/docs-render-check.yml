name: Docs render check

# One check that a PR can't break docs.linkrunner.io. Mintlify deploys `main` as soon as it
# changes, so anything it can't render (an MDX parse error, a page in docs.json with no file,
# an import or component that doesn't resolve, an OpenAPI spec that doesn't parse, a broken
# internal link) has to be caught here, before merge.
#
# `mint validate` runs Mintlify's content checks and then a strict build; it exits 1 on any
# error. `mint broken-links` checks every internal link and anchor. The CLI is pinned so a new
# Mintlify release can't change the result of an unchanged PR; bump MINT_VERSION on purpose.
#
# Runs on every PR (no path filter) so it can be a required check, and on pushes to main so a
# direct push that breaks rendering still shows a red X.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-render-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MINT_VERSION: "4.2.1184"

jobs:
  render:
    name: Docs render check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate content and build (mint validate)
        run: npx --yes "mint@${MINT_VERSION}" validate

      - name: Check internal links (mint broken-links)
        run: npx --yes "mint@${MINT_VERSION}" broken-links
