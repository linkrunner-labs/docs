name: Docs route guard

# Runs on every PR (no path filter) so it can be a required check: a
# required check that never starts would block the PR.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check-routes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check published documentation routes
        run: node scripts/check-doc-routes.mjs "${{ github.event.pull_request.base.sha }}"

      - name: Check shared documentation instructions and skills
        run: npm run check:agents
