name: Docs route guard

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "docs.json"
      - "scripts/check-doc-routes.mjs"
      - "scripts/check-doc-agent-files.test.mjs"
      - ".agents/skills/**"
      - ".claude/skills/**"
      - "package.json"
      - ".github/workflows/docs-route-guard.yml"

permissions:
  contents: read

jobs:
  check-routes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check published documentation routes
        run: node scripts/check-doc-routes.mjs "${{ github.event.pull_request.base.sha }}"

      - name: Check shared documentation instructions and skills
        run: npm run check:agents
